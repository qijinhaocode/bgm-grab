<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BGM Grab · YouTube 音频抓取</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --line: #e5e5ea;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --blue: #0071e3;
    --blue-hover: #0077ed;
    --green: #1a7f37;
    --green-bg: #e9f7ed;
    --red: #c02626;
    --red-bg: #fdecec;
    --amber: #8a6100;
    --amber-bg: #fff6df;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 20px 64px;
    background: var(--bg); color: var(--text);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  header { margin-bottom: 22px; }
  h1 { font-size: 26px; letter-spacing: -.5px; margin: 0 0 4px; font-weight: 650; }
  .sub { color: var(--muted); margin: 0; }
  h2 { font-size: 14px; font-weight: 620; margin: 0 0 12px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 18px 20px; margin-bottom: 14px;
    box-shadow: 0 1px 2px rgba(0,0,0,.03);
  }
  .row { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .row.between { justify-content: space-between; }
  .spacer { flex: 1; }
  .hint { color: var(--muted); font-size: 12.5px; }
  input[type=text], input[type=url], textarea {
    font: inherit; color: var(--text); background: #fff;
    border: 1px solid #d2d2d7; border-radius: 9px; padding: 9px 11px;
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  input:focus, textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(0,113,227,.13); }
  #outDir { flex: 1; min-width: 260px; font-family: var(--mono); font-size: 12.5px; }
  #urls { width: 100%; min-height: 130px; resize: vertical; font-family: var(--mono); font-size: 12.5px; line-height: 1.7; }
  #client { width: 150px; font-family: var(--mono); font-size: 12.5px; padding: 6px 9px; }
  button {
    font: inherit; font-weight: 520; border-radius: 9px; padding: 8px 15px;
    border: 1px solid transparent; cursor: pointer; transition: background .15s, opacity .15s;
    white-space: nowrap;
  }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .ghost { background: #f5f5f7; color: var(--text); border-color: var(--line); }
  .ghost:hover:not(:disabled) { background: #ebebef; }
  .primary { background: var(--blue); color: #fff; }
  .primary:hover:not(:disabled) { background: var(--blue-hover); }
  .danger { background: var(--red-bg); color: var(--red); border-color: #f3c9c9; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 11px; border-radius: 100px; font-size: 12.5px;
    background: #f5f5f7; border: 1px solid var(--line); color: var(--muted);
  }
  .chip b { color: var(--text); font-weight: 570; }
  .chip.ok { background: var(--green-bg); border-color: #c8e9cf; color: var(--green); }
  .chip.ok b { color: var(--green); }
  .chip.bad { background: var(--red-bg); border-color: #f3c9c9; color: var(--red); }
  .chip.bad b { color: var(--red); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .alert {
    margin-top: 12px; padding: 10px 13px; border-radius: 9px;
    background: var(--red-bg); color: var(--red); border: 1px solid #f3c9c9; font-size: 13px;
  }
  .opts { margin-top: 12px; }
  .opts label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; }
  .opts label.client { gap: 8px; }
  input[type=checkbox] { accent-color: var(--blue); width: 15px; height: 15px; }
  .probe-item {
    display: flex; align-items: baseline; gap: 10px; padding: 7px 0;
    border-bottom: 1px solid #f0f0f2; font-size: 13px;
  }
  .probe-item:last-child { border-bottom: 0; }
  .probe-item .idx { color: var(--muted); font-family: var(--mono); font-size: 11.5px; min-width: 22px; }
  .probe-item .title { flex: 1; word-break: break-all; }
  .probe-item .dur { color: var(--muted); font-family: var(--mono); font-size: 12px; }
  .probe-item .err { color: var(--red); flex: 1; word-break: break-all; }
  .badge { padding: 2px 8px; border-radius: 100px; font-size: 11.5px; background: var(--amber-bg); color: var(--amber); }
  .progress { height: 7px; background: #ececf0; border-radius: 100px; overflow: hidden; margin: 4px 0 12px; }
  #progressBar { height: 100%; width: 0; background: var(--blue); border-radius: 100px; transition: width .25s ease; }
  #progressBar.indeterminate { width: 32% !important; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left: -32%; } 100% { margin-left: 100%; } }
  #log {
    margin: 12px 0 0; padding: 12px 14px; height: 210px; overflow: auto;
    background: #fafafa; border: 1px solid var(--line); border-radius: 9px;
    font: 11.5px/1.65 var(--mono); color: #3a3a3c; white-space: pre-wrap; word-break: break-all;
  }
  .file-item {
    display: flex; align-items: center; gap: 9px; padding: 8px 11px; margin-top: 7px;
    background: var(--green-bg); border: 1px solid #c8e9cf; border-radius: 9px; font-size: 12.5px;
  }
  .file-item .name { flex: 1; word-break: break-all; color: #14532d; }
  .file-item .size { color: var(--green); font-family: var(--mono); }
  .file-item button { padding: 3px 9px; font-size: 11.5px; }
  .summary { padding: 10px 13px; border-radius: 9px; margin-top: 10px; font-size: 13px; }
  .summary.ok { background: var(--green-bg); color: var(--green); }
  .summary.bad { background: var(--red-bg); color: var(--red); }
  #toast {
    position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 14px);
    background: #1d1d1f; color: #fff; padding: 9px 16px; border-radius: 100px;
    font-size: 12.5px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 9;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  code { font-family: var(--mono); font-size: 12px; background: #f0f0f2; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>BGM Grab</h1>
    <p class="sub">粘贴 YouTube 链接 → 转成 mp3 → 直接落到剪辑素材盘。本地服务，只监听 127.0.0.1。</p>
  </header>

  <section class="card">
    <div class="row between" style="margin-bottom:12px">
      <h2 style="margin:0">环境检查</h2>
      <button class="ghost" id="btnRefresh">重新检测</button>
    </div>
    <div class="chips" id="chips"><span class="hint">检测中…</span></div>
    <div class="alert" id="alert" hidden></div>
  </section>

  <section class="card">
    <div class="row between">
      <h2 style="margin:0">输出目录</h2>
      <span class="hint" id="configHint"></span>
    </div>
    <div class="row" style="margin-top:12px">
      <input type="text" id="outDir" spellcheck="false" placeholder="启动后自动填入">
      <button class="ghost" id="btnCheckDir">检测</button>
      <button class="ghost" id="btnOpenDir">在文件管理器打开</button>
    </div>
    <div class="row" style="margin-top:10px">
      <label class="client">player_client <input type="text" id="clientCfg" value="web_embedded" spellcheck="false"></label>
      <label title="外置卷未挂载时拦截下载，防止素材写进系统盘">
        <input type="checkbox" id="strictVolume"> 外置卷保护
      </label>
      <span class="spacer"></span>
      <button class="ghost" id="btnSaveConfig">保存设置</button>
    </div>
    <div class="hint" id="dirHint" style="margin-top:9px"></div>
  </section>

  <section class="card">
    <div class="row between">
      <h2 style="margin:0">链接</h2>
      <span class="hint">一行一个，支持批量 · ⌘↵ 直接下载</span>
    </div>
    <textarea id="urls" spellcheck="false" placeholder="https://www.youtube.com/watch?v=fbszJJr9I9U" style="margin-top:11px"></textarea>
    <div class="row opts">
      <label title="默认只下单个视频，避免误把整张播放列表拖下来">
        <input type="checkbox" id="allowPlaylist"> 允许整张播放列表
      </label>
      <span class="spacer"></span>
      <button class="ghost" id="btnProbe">预检</button>
      <button class="ghost" id="btnCopy">复制等效命令</button>
      <button class="primary" id="btnDownload">下载音频</button>
    </div>
  </section>

  <section class="card" id="probeCard" hidden>
    <h2>预检结果</h2>
    <div id="probeList"></div>
  </section>

  <section class="card" id="jobCard" hidden>
    <div class="row between" style="margin-bottom:8px">
      <h2 style="margin:0">任务</h2>
      <span class="hint" id="jobMeta"></span>
    </div>
    <div class="progress"><div id="progressBar"></div></div>
    <div class="row">
      <span class="hint" id="jobStatus">准备中…</span>
      <span class="spacer"></span>
      <button class="ghost" id="btnCancel">取消</button>
    </div>
    <pre id="log"></pre>
    <div id="files"></div>
    <div id="summary"></div>
  </section>

  <p class="hint" style="text-align:center;margin-top:20px">
    固定参数：<code>--ignore-config -x --audio-format mp3 --audio-quality 0</code> ·
    换 <code>player_client</code> 可应对 YouTube 反爬策略变化
  </p>
</div>
<div id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const TOKEN = document.querySelector('meta[name="bgm-token"]')?.content || '';
let dirOK = false;
let es = null, jobId = null;
let total = 0, completed = 0, curPercent = 0, allFiles = [];
let probeTimer = null, toastTimer = null;
let envCache = { ytdlp: null, ffmpeg: false };

function fmtBytes(n) {
  if (n == null) return '—';
  if (n >= 1024 ** 3) return (n / 1024 ** 3).toFixed(1) + ' GiB';
  if (n >= 1024 ** 2) return (n / 1024 ** 2).toFixed(0) + ' MiB';
  return (n / 1024).toFixed(0) + ' KiB';
}

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

async function api(p, body) {
  const opt = body === undefined ? {} : {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-bgm-token': TOKEN },
    body: JSON.stringify(body),
  };
  const r = await fetch(p, opt);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}

function currentClient() {
  return $('#clientCfg').value.trim() || 'web_embedded';
}

function cfg() {
  return {
    outDir: $('#outDir').value.trim(),
    client: currentClient(),
    allowPlaylist: $('#allowPlaylist').checked,
    urls: $('#urls').value.split(/[\n\r]+/).flatMap((l) => l.trim().split(/\s+/)).filter(Boolean),
  };
}

function chip(label, value, state) {
  return '<span class="chip ' + (state || '') + '"><span class="dot"></span>' + label + ' <b>' + value + '</b></span>';
}

function renderDir(d, ytdlp, ffmpeg) {
  const parts = [];
  parts.push(chip('yt-dlp', ytdlp ? ytdlp.version || '已找到' : '未找到', ytdlp ? 'ok' : 'bad'));
  parts.push(chip('ffmpeg', ffmpeg ? 'OK' : '未找到', ffmpeg ? 'ok' : 'bad'));
  parts.push(chip('输出卷', d.strict ? (d.mounted ? '已挂载' : '未挂载') : '内置路径', (d.strict && !d.mounted) ? 'bad' : 'ok'));
  parts.push(chip('可用空间', fmtBytes(d.freeBytes)));
  $('#chips').innerHTML = parts.join('');

  const blockers = [];
  if (!d.exists) blockers.push('输出目录不存在：' + (d.reason || ''));
  else if (!d.writable) blockers.push('输出目录不可写');
  if (d.strict && !d.mounted) blockers.push('外置卷未挂载 —— 已拦截下载，避免素材写进系统盘');
  if (!ytdlp) blockers.push('未找到 yt-dlp：设置 YT_DLP 环境变量或在页面配置');
  if (!ffmpeg) blockers.push('未找到 ffmpeg（转 mp3 必需）');
  dirOK = blockers.length === 0;

  const alert = $('#alert');
  if (!dirOK) {
    alert.textContent = blockers.join(' · ');
    alert.hidden = false;
  } else {
    alert.hidden = true;
  }
  $('#btnDownload').disabled = !dirOK;
  $('#dirHint').textContent = d.exists
    ? (d.device || '本地路径') + ' · 可写 · 剩余 ' + fmtBytes(d.freeBytes) + (d.strict ? ' · 外置卷保护已开' : '')
    : (d.reason || '');
}

async function checkDir(customDir) {
  try {
    const dir = customDir || $('#outDir').value.trim();
    const s = await api('/api/status', { outDir: dir });
    renderDir(s.dir, envCache.ytdlp, envCache.ffmpeg);
    return s.dir;
  } catch (e) {
    $('#dirHint').textContent = '检测失败：' + e.message;
    return null;
  }
}

async function refreshAll() {
  try {
    const s = await api('/api/status');
    envCache = { ytdlp: s.ytdlp, ffmpeg: s.ffmpeg };
    $('#outDir').value = s.outDir;
    $('#clientCfg').value = s.defaultClient;
    if (s.dir && s.dir.strict !== undefined) $('#strictVolume').checked = !!s.dir.strict;
    $('#configHint').textContent = '配置文件：' + (s.configPath || '');
    renderDir(s.dir, s.ytdlp, s.ffmpeg);
  } catch (e) {
    $('#chips').innerHTML = chip('服务', '连接失败：' + e.message, 'bad');
  }
}

function renderProbe(items) {
  $('#probeCard').hidden = false;
  $('#probeList').innerHTML = items.map((it, i) => {
    if (!it.ok) {
      return '<div class="probe-item"><span class="idx">' + (i + 1) + '</span>' +
        '<span class="err">' + escapeHtml(it.url) + ' → ' + escapeHtml(it.error) + '</span></div>';
    }
    return '<div class="probe-item"><span class="idx">' + (i + 1) + '</span>' +
      '<span class="title">' + escapeHtml(it.title) + '</span>' +
      '<span class="dur">' + escapeHtml(it.duration || '—') + '</span></div>';
  }).join('');
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}

async function probe() {
  const c = cfg();
  if (!c.urls.length) { toast('请先粘贴链接'); return; }
  $('#btnProbe').disabled = true;
  $('#probeCard').hidden = false;
  $('#probeList').innerHTML = '<div class="hint">正在读取标题与时长…</div>';
  try {
    const r = await api('/api/probe', { urls: c.urls, client: c.client, allowPlaylist: c.allowPlaylist });
    renderProbe(r.items);
  } catch (e) {
    $('#probeList').innerHTML = '<div class="probe-item"><span class="err">' + escapeHtml(e.message) + '</span></div>';
  } finally {
    $('#btnProbe').disabled = false;
  }
}

function appendLog(line) {
  const el = $('#log');
  el.textContent += line + '\n';
  const lines = el.textContent.split('\n');
  if (lines.length > 400) el.textContent = lines.slice(-400).join('\n');
  el.scrollTop = el.scrollHeight;
}

function setProgress() {
  const bar = $('#progressBar');
  bar.classList.remove('indeterminate');
  const pct = total ? Math.min(100, ((completed + curPercent / 100) / total) * 100) : 0;
  bar.style.width = pct.toFixed(1) + '%';
}

function renderFiles() {
  $('#files').innerHTML = allFiles.map((f) =>
    '<div class="file-item"><span class="name">' + escapeHtml(f.name) + '</span>' +
    '<span class="size">' + fmtBytes(f.size) + '</span>' +
    '<button class="ghost" data-path="' + escapeHtml(f.path) + '">在文件管理器显示</button></div>'
  ).join('');
  $('#files').querySelectorAll('button[data-path]').forEach((b) => {
    b.onclick = () => api('/api/open', { path: b.dataset.path, outDir: $('#outDir').value.trim(), reveal: true })
      .catch((e) => toast(e.message));
  });
}

function handleEvent(e) {
  switch (e.type) {
    case 'job_start':
      total = e.total; completed = 0; curPercent = 0; allFiles = [];
      $('#jobMeta').textContent = '共 ' + total + ' 首 · 串行执行';
      $('#jobStatus').textContent = '开始下载…';
      $('#summary').innerHTML = '';
      $('#progressBar').classList.add('indeterminate');
      break;
    case 'item_start':
      curPercent = 0;
      $('#jobStatus').textContent = '正在下载第 ' + (e.index + 1) + ' / ' + e.total + ' 首';
      appendLog('── [' + (e.index + 1) + '/' + e.total + '] ' + e.url);
      break;
    case 'log':
      appendLog(e.line);
      break;
    case 'progress':
      curPercent = Math.max(curPercent, e.percent);
      setProgress();
      break;
    case 'item_done':
      completed++;
      curPercent = 0;
      for (const f of (e.files || [])) allFiles.push(f);
      renderFiles();
      appendLog(e.ok ? '✅ 完成' : '❌ 失败：' + (e.error || '未知原因'));
      setProgress();
      break;
    case 'job_done':
      $('#jobStatus').textContent = '结束';
      $('#progressBar').classList.remove('indeterminate');
      $('#progressBar').style.width = '100%';
      $('#btnCancel').disabled = true;
      const bad = e.failed || 0;
      $('#summary').innerHTML = '<div class="summary ' + (bad ? 'bad' : 'ok') + '">' +
        (e.cancelled ? '已取消。' : '') + '成功 ' + (e.ok || 0) + ' 首，失败 ' + bad + ' 首。' +
        (allFiles.length ? ' 文件已保存到 ' + escapeHtml($('#outDir').value.trim()) : '') + '</div>';
      if (es) { es.close(); es = null; }
      break;
  }
}

async function startDownload() {
  const c = cfg();
  if (!c.urls.length) { toast('请先粘贴链接'); return; }
  if (!dirOK) { toast('输出目录不可用，请先检测挂载'); return; }
  $('#btnDownload').disabled = true;
  try {
    const r = await api('/api/download', c);
    jobId = r.jobId;
    $('#jobCard').hidden = false;
    $('#log').textContent = '';
    $('#files').innerHTML = '';
    $('#summary').innerHTML = '';
    $('#btnCancel').disabled = false;
    $('#progressBar').style.width = '0';
    if (es) es.close();
    es = new EventSource('/api/events?jobId=' + encodeURIComponent(jobId));
    es.onmessage = (ev) => { try { handleEvent(JSON.parse(ev.data)); } catch (err) { console.error(err); } };
    es.onerror = () => { $('#jobStatus').textContent = '连接中断'; if (es) { es.close(); es = null; } };
  } catch (e) {
    toast('启动失败：' + e.message);
    appendLog('启动失败：' + e.message);
    $('#jobCard').hidden = false;
  } finally {
    $('#btnDownload').disabled = !dirOK;
    setTimeout(() => { $('#btnDownload').disabled = !dirOK; }, 400);
  }
}

$('#btnRefresh').onclick = refreshAll;
$('#btnCheckDir').onclick = () => checkDir().then(() => toast('已重新检测'));
$('#btnOpenDir').onclick = () => api('/api/open', { path: $('#outDir').value.trim(), outDir: $('#outDir').value.trim() })
  .catch((e) => toast(e.message));
$('#outDir').onchange = () => checkDir();
$('#btnSaveConfig').onclick = async () => {
  try {
    await api('/api/config', {
      outDir: $('#outDir').value.trim(),
      client: currentClient(),
      strictVolume: $('#strictVolume').checked,
    });
    toast('设置已保存，下次启动生效');
  } catch (e) { toast('保存失败：' + e.message); }
};
$('#clientCfg').onchange = () => toast('改完记得点「保存设置」');
$('#btnProbe').onclick = probe;
$('#btnDownload').onclick = startDownload;
$('#btnCancel').onclick = async () => {
  if (!jobId) return;
  try { await api('/api/cancel', { jobId }); $('#jobStatus').textContent = '正在取消…'; }
  catch (e) { toast(e.message); }
};
$('#btnCopy').onclick = async () => {
  try {
    const r = await api('/api/command', cfg());
    await navigator.clipboard.writeText(r.command);
    toast('命令已复制，可直接粘到终端');
  } catch (e) { toast('复制失败：' + e.message); }
};
$('#urls').addEventListener('input', () => {
  clearTimeout(probeTimer);
  const n = cfg().urls.length;
  if (n > 0 && n <= 12) probeTimer = setTimeout(probe, 900);
});
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); startDownload(); }
});

refreshAll();
</script>
</body>
</html>
